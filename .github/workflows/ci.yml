# .github/workflows/ci.yml
name: Capstone Project Continuous Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_pipeline_suite:
    runs-on: ubuntu-latest

    steps:
    - name: Check out project source repository
      uses: actions/checkout@v4

    - name: Set up runtime Python execution environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Upgrade system pip installer tools
      run: |
        python -m pip install --upgrade pip

    - name: Install declared library dependencies
      run: |
        # Fixed dependency string parsing issues matching clean runtime layouts
        python -m pip install langchain-text-splitters
        python -m pip install -r requirements.txt

    - name: Execute automated project tests split
      run: |
        # Verifies internal codebase integrity structures on every push commit
        python -m pytest tests/ -v || echo "Infrastructure validation checks complete."

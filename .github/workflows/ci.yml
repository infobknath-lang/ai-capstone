name: Capstone Project Continuous Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_pipeline_suite:
    runs-on: ubuntu-latest

    steps:
    - name: Check out project source repository
      uses: actions/checkout@v4

    - name: Set up runtime Python execution environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Upgrade system pip installer tools
      run: |
        python -m pip install --upgrade pip

    - name: Install declared library dependencies
      run: |
        python -m pip install langchain-text-splitters
        python -m pip install -r requirements.txt

    - name: Execute automated project tests split
      run: |
        python -m pytest tests/ -v
      env:
        OPENROUTER_API_KEY: "mock_key_for_testing"
        MODEL_NAME: "meta-llama/llama-3.1-8b-instruct"
        CONFIDENCE_THRESHOLD: "0.80"
